# Publish to PyPI using Trusted Publishing (OIDC — no long-lived token stored anywhere).
#
# ONE-TIME SETUP on pypi.org (already done for this project):
#   PyPI -> Account settings -> Publishing -> Add a new pending trusted publisher
#     PyPI Project Name: verieffect
#     Owner:             bfeng1122
#     Repository name:   verieffect
#     Workflow name:     publish.yml
#     Environment:       (blank — this workflow deliberately has NO `environment:`
#                         block; the publisher config and the workflow must match)
#
# Trigger: push a v* tag (e.g. `git tag v0.2.0a3 && git push origin v0.2.0a3`).
# Deliberately NO workflow_dispatch: the tag/version gate below can only run on a
# tag ref, and a manual-dispatch run would skip it. Publishing is tag-only, so the
# gate always runs. (PyPI also rejects re-uploads of an existing version, so a
# stray run could not clobber a release — but tag-only is the honest guarantee.)
# The job runs the full test suite first and refuses to publish if the tag (minus
# a leading "v") != pyproject.toml's version.

name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          tag = os.environ["TAG"]
          tag_version = tag[1:] if tag.startswith("v") else tag
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          if tag_version != version:
              sys.exit(f"tag {tag!r} -> {tag_version!r} does not match "
                       f"pyproject.toml version {version!r}; refusing to publish")
          print(f"tag {tag!r} matches pyproject.toml version {version!r}")
          EOF

      - name: Run test suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python tests/test_all.py

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
