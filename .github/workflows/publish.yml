# Publish to PyPI using Trusted Publishing (OIDC — no long-lived token stored anywhere).
#
# ONE-TIME SETUP REQUIRED on pypi.org before the first run:
#   PyPI -> Account settings -> Publishing -> Add a new pending trusted publisher
#     PyPI Project Name: verieffect
#     Owner:             bfeng1122
#     Repository name:   verieffect
#     Workflow name:     publish.yml
#     Environment:       (leave blank)
#
# Trigger: push a v* tag (e.g. `git tag v0.2.0a1 && git push origin v0.2.0a1`)
# or run manually from the Actions tab.

name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/verieffect/
    permissions:
      id-token: write   # OIDC for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
